# Include inside the existing xym.aittco.com server block.
# Merge with existing exact / and /index.html locations instead of duplicating them.
# Keep the server root pointing at the public frontend directory.
location = / {
    rewrite ^ /index.html last;
}

location = /index.html {
    expires off;
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}
